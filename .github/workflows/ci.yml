name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: orderdesk
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: orderdesk_test
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U orderdesk" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: api/pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Tests (real Postgres)
        shell: bash
        run: |
          set +e
          pytest -q 2>&1 | tee pytest.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then grep -E "Error|error|FAILED|assert" pytest.log | tail -10 | while IFS= read -r l; do echo "::error::$l"; done; fi
          exit $status

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  e2e:
    # End-to-end against the same Docker image Render deploys: migrations, first-boot seed, UI, worker, mock ERP.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [api, web]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: orderdesk
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: orderdesk
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U orderdesk" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the demo image
        run: docker build -t orderdesk-demo .
      - name: "Start it (no model key: the fallback parser reads orders)"
        run: |
          docker run -d --name od --network host -e PORT=8000 -e PARSE_DELAY_S=1 -e SECRET_KEY=ci -e COOKIE_SECURE=0 \
            -e DATABASE_URL=postgresql://orderdesk@127.0.0.1:5433/orderdesk orderdesk-demo
          for i in $(seq 1 60); do curl -sf localhost:8000/healthz && break; sleep 1; done
      - name: Playwright
        working-directory: web
        run: npm ci && npx playwright install --with-deps chromium
      - name: End-to-end tests
        working-directory: web
        run: npx playwright test
      - name: The image holds no eval data or ground truth
        run: docker run --rm orderdesk-demo sh -c 'test ! -e /app/data/eval && test ! -e /app/api/evals && test ! -e /app/api/tests'
      - name: Server log on failure
        if: failure()
        run: docker logs od 2>&1 | tail -100
