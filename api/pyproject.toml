[project]
name = "orderdesk"
version = "0.1.0"
description = "WhatsApp orders in four language styles turned into draft sales orders, confirmed by a human, posted to an ERP."
requires-python = ">=3.11"
dependencies = [
  "anthropic>=1.8",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0.30",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "rapidfuzz>=3.9",
  "pydantic>=2.7",
  "httpx>=0.27",
  "argon2-cffi>=23.1",
  "itsdangerous>=2.2",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# the world generator and the eval scripts; the server needs none of these
world = ["pillow>=10.3", "numpy>=1.26", "scipy>=1.11"]
dev = ["orderdesk[world]", "pytest>=8", "pytest-asyncio>=0.23", "ruff==0.16.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orderdesk"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF", "ISC", "PLC"]
ignore = ["E501", "RUF001", "RUF002", "RUF003", "ISC004"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header", "fastapi.File", "fastapi.Form", "fastapi.Body"]
